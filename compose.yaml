services:
  lux:
    image: pdzhou/lux:latest
    container_name: lux
    user: "0:0"
    mem_limit: ${LUX_MEMORY_LIMIT:-2g}
    environment:
      MALLOC_ARENA_MAX: ${LUX_MALLOC_ARENA_MAX:-2}
      LUX_DB_MAX_CONNECTIONS: ${LUX_DB_MAX_CONNECTIONS-}
      LUX_SCAN_CONCURRENCY: ${LUX_SCAN_CONCURRENCY:-4}
      LUX_PROBE_CONCURRENCY: ${LUX_PROBE_CONCURRENCY-}
      LUX_FFMPEG_CONCURRENCY: ${LUX_FFMPEG_CONCURRENCY:-2}
      LUX_BACKGROUND_CPU_BUDGET: ${LUX_BACKGROUND_CPU_BUDGET-}
      LUX_DISCOVERY_BIND_ADDR: ${LUX_DISCOVERY_BIND_ADDR:-0.0.0.0:7359}
      LUX_DISCOVERY_ADVERTISE_URL: ${LUX_DISCOVERY_ADVERTISE_URL-}
    ports:
      - "8097:8097"
      - "7359:7359/udp"
    volumes:
      - ./config:/config:rw
      - ./media:/media:rw
    # 服务端 GPU 转码需要把设备映射进容器，按平台取消对应注释后重启容器：
    #
    # Intel / AMD（VAAPI、QSV）：先确认宿主机存在 /dev/dri/renderD128，再映射整个 /dev/dri。
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA（NVENC）：宿主机需安装驱动与 nvidia-container-toolkit，并为该服务启用 GPU。
    # gpus: all
    # runtime: nvidia
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lux-postgres
    profiles:
      - postgres
    # Parallel VACUUM needs more than Docker's default 64 MB /dev/shm.
    shm_size: 512mb
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: ${LUX_POSTGRES_DB:-lux}
      POSTGRES_USER: ${LUX_POSTGRES_USER:-lux}
      POSTGRES_PASSWORD: ${LUX_POSTGRES_PASSWORD:-}
    volumes:
      # Store PostgreSQL data directly in the project directory.
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
