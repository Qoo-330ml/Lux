services:
  lux:
    image: pdzhou/lux:latest
    container_name: lux
    user: "0:0"
    mem_limit: ${LUX_MEMORY_LIMIT:-2g}
    environment:
      MALLOC_ARENA_MAX: ${LUX_MALLOC_ARENA_MAX:-2}
    ports:
      - "8097:8097"
    volumes:
      - ./config:/config:rw
      - ./media:/media:rw
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lux-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${LUX_POSTGRES_DB:-lux}
      POSTGRES_USER: ${LUX_POSTGRES_USER:-lux}
      POSTGRES_PASSWORD: ${LUX_POSTGRES_PASSWORD:-}
    volumes:
      # Store PostgreSQL data directly in the project directory.
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
