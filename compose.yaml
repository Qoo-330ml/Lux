services:
  lux:
    build:
      context: .
      dockerfile: Dockerfile
    image: lux:local
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      LUX_HTTP_ADDR: 0.0.0.0:8097
      LUX_CONFIG_DIR: /data/config
      LUX_TRUSTED_PROXY_CIDRS: ${LUX_TRUSTED_PROXY_CIDRS:-}
      LUX_TMDB_READ_ACCESS_TOKEN: ${LUX_TMDB_READ_ACCESS_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-luxd=info,tower_http=info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - lux-data:/data
      - ${LUX_MEDIA_DIR:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8097/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lux-data:
