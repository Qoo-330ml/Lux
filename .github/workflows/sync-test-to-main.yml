name: Sync test to main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-test-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge test into main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.sync.outputs.updated }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge and push test to main
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main test
          git reset --hard origin/main
          if git merge-base --is-ancestor origin/test origin/main; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "test is already included in main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/test
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish latest from main
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/dockerhub.yml
    secrets: inherit
