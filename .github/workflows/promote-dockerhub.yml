name: Promote Docker Hub image

on:
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: lux

jobs:
  promote:
    name: Promote test to latest and version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read Lux version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "luxd") | .version')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote test manifest to latest and version
        shell: bash
        run: |
          set -euo pipefail
          source_image="docker.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:test"
          latest_image="docker.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:latest"
          version_image="docker.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:v${{ steps.version.outputs.version }}"

          docker buildx imagetools inspect "$source_image"
          docker buildx imagetools create \
            --tag "$latest_image" \
            "$source_image"
          docker buildx imagetools create \
            --tag "$version_image" \
            "$source_image"
