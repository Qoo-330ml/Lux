name: Promote Docker Hub image

on:
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: lux

jobs:
  promote:
    name: Promote test to latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote test manifest to latest
        shell: bash
        run: |
          set -euo pipefail
          source_image="docker.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:test"
          target_image="docker.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:latest"

          docker buildx imagetools inspect "$source_image"
          docker buildx imagetools create \
            --tag "$target_image" \
            "$source_image"
