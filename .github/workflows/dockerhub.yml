name: Docker Hub image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Pull requests do not receive repository secrets, so use a local-only
  # namespace for metadata while keeping publishing disabled.
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
  IMAGE_NAME: lux

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            type=ref,event=pr
            type=raw,value=test,enable={{is_default_branch}}

      - name: Build and publish architecture image
        shell: bash
        env:
          APP_TAGS: ${{ steps.meta.outputs.tags }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_REVISION: ${{ github.sha }}
          APP_PLATFORM: ${{ matrix.platform }}
          APP_ARCH: ${{ matrix.arch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          app_tags="$(printf '%s\n' "$APP_TAGS" | paste -sd, -)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            app_output="app.output=type=docker"
          else
            app_output="app.output=type=registry"
          fi

          bake_args=(
            --file ./docker-bake.hcl
            --set "runtime.platform=$APP_PLATFORM"
            --set "app.platform=$APP_PLATFORM"
            --set "app.tags=$app_tags"
            --set "app.args.LUX_VERSION=$APP_VERSION"
            --set "app.args.LUX_REVISION=$APP_REVISION"
            --set "runtime.cache-from=type=gha,scope=lux-runtime-$APP_ARCH"
            --set "runtime.cache-to=type=gha,mode=max,scope=lux-runtime-$APP_ARCH"
            --set "app.cache-from=type=gha,scope=lux-$APP_ARCH"
            --set "app.cache-to=type=gha,mode=max,scope=lux-$APP_ARCH"
            --set "$app_output"
          )
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            bake_args+=(
              --set "app.attest=type=provenance,mode=max"
              --set "app.attest=type=sbom"
            )
          fi

          docker buildx bake "${bake_args[@]}" app

  manifest:
    name: Merge Docker Hub manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract final image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=test,enable={{is_default_branch}}

      - name: Merge architecture manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
