name: Docker Hub image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Pull requests do not receive repository secrets, so use a local-only
  # namespace for metadata while keeping publishing disabled.
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
  IMAGE_NAME: lux
  RUNTIME_IMAGE_NAME: lux-runtime
  RUNTIME_IMAGE_TAG: trixie-ffmpeg-v2

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            type=ref,event=pr
            type=raw,value=test,enable={{is_default_branch}}

      - name: Determine runtime image
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          local_tag="${RUNTIME_IMAGE_NAME}:${RUNTIME_IMAGE_TAG}-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "image=$local_tag" >> "$GITHUB_OUTPUT"
            echo "tag=$local_tag" >> "$GITHUB_OUTPUT"
          else
            remote_tag="docker.io/${IMAGE_NAMESPACE}/${RUNTIME_IMAGE_NAME}:${RUNTIME_IMAGE_TAG}-${{ matrix.arch }}"
            echo "image=$remote_tag" >> "$GITHUB_OUTPUT"
            echo "tag=$remote_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./runtime/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.runtime.outputs.tag }}
          build-args: |
            LUX_RUNTIME_VERSION=${{ env.RUNTIME_IMAGE_TAG }}
          cache-from: type=gha,scope=lux-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lux-runtime-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LUX_VERSION=${{ steps.meta.outputs.version }}
            LUX_REVISION=${{ github.sha }}
            LUX_RUNTIME_IMAGE=${{ steps.runtime.outputs.image }}
          cache-from: type=gha,scope=lux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lux-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    name: Merge Docker Hub manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract final image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=test,enable={{is_default_branch}}

      - name: Merge architecture manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

          runtime_image="docker.io/${IMAGE_NAMESPACE}/${RUNTIME_IMAGE_NAME}:${RUNTIME_IMAGE_TAG}"
          docker buildx imagetools create \
            --tag "$runtime_image" \
            "${runtime_image}-amd64" \
            "${runtime_image}-arm64"
