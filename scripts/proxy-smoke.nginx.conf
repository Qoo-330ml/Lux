server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://lux-proxy-upstream:8097;
        proxy_http_version 1.1;
        # $http_host keeps the non-default port the browser used. The WebSocket handshake compares
        # Origin's host[:port] with this header (ADR-054 D5), so `$host` would drop ":$PORT" and every
        # handshake would answer 400.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade (ADR-054 D12). Without both lines the handshake reaches Lux as a plain
        # GET and the browser only sees `close 1006`.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
