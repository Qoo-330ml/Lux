[package]
name = "luxd"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
description = "Lux personal media server"
license = "MIT"

[dependencies]
argon2 = "0.5.3"
ab_glyph = "0.2"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
md-5 = "0.11"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "socks",
    "stream",
    "system-proxy",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite"] }
subtle = "2"
tokio = { version = "1", features = ["io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "luxd"
path = "src/lib.rs"

[[bin]]
name = "luxd"
path = "src/main.rs"
