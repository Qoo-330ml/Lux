[package]
name = "luxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lux personal media server"
license = "MIT"

[dependencies]
argon2 = "0.5.3"
axum = "0.8"
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["macros", "runtime-tokio", "sqlite", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[lib]
name = "luxd"
path = "src/lib.rs"

[[bin]]
name = "luxd"
path = "src/main.rs"
